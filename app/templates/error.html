<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Could not save — Cloud Seminar Demo</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; background: #f4f6f8; margin: 0; color: #1c2833; }
    main { max-width: 40rem; margin: 2.5rem auto; background: #fff; padding: 2rem; border: 1px solid #d5dde5; }
    h1 { font-family: system-ui, sans-serif; font-size: 1.6rem; margin-top: 0; }
    .error { background: #fdecea; border: 1px solid #e6b0aa; padding: 0.75rem 1rem; }
    a.button { font-family: system-ui, sans-serif; margin-top: 1.25rem; background: #1f4e79; color: #fff; text-decoration: none; padding: 0.6rem 1.2rem; display: inline-block; }
    footer { font-family: system-ui, sans-serif; color: #5d6d7e; font-size: 0.9rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <main>
    <h1>Could not save the message</h1>
    <p class="error">The message could not be saved. Please try again.</p>
    <p>The application is still running. Nothing was stored on the Pod.</p>
    <a class="button" href="/">Back to the form</a>
    <footer>{{.AppName}} {{.Version}}</footer>
  </main>
</body>
</html>
