{{/*
This chart does not create a Secret by default.
The Go application uses the EC2 instance IAM role through the AWS SDK
credential chain. Do not put AWS access keys in this file.
*/}}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloud-demo.fullname" . }}
  labels:
    {{- include "cloud-demo.labels" . | nindent 4 }}
type: Opaque
stringData: {}
{{- end }}
