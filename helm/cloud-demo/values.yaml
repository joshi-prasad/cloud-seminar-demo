image:
  repository: joshiprasad/cloud-seminar-demo
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

service:
  type: NodePort
  port: 8080

application:
  name: cloud-seminar-demo
  version: "1.0.0"
  port: 8080

aws:
  region: us-west-2
  s3Bucket: prasad-cloud-demo

# The chart does not store AWS credentials.
# Pods use the EC2 instance IAM role through the AWS SDK credential chain.
secret:
  create: false

serviceAccount:
  create: true
  name: ""

terminationGracePeriodSeconds: 15

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
